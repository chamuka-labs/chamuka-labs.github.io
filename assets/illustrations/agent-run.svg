<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="520" height="160" fill="none" role="img" aria-labelledby="ar-title ar-desc">
  <title id="ar-title">Agent Run pipeline</title>
  <desc id="ar-desc">Four composable subcommands: retry with backoff, a verify-fix loop, an adversarial review, and a YAML pipeline.</desc>
  <rect width="520" height="160" rx="12" fill="#FFF8F1"/>
  <g font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
    <rect x="16" y="36" width="108" height="88" rx="8" fill="#FFFFFF" stroke="#E6D9C8"/>
    <text x="70" y="76" text-anchor="middle" font-size="16" font-weight="600" fill="#17141C">retry</text>
    <text x="70" y="96" text-anchor="middle" font-size="13" fill="#6B645C">backoff</text>
    <path d="M124 80 h20" stroke="#E24E1B" stroke-width="1.5"/>
    <path d="M138 74 l8 6 -8 6" fill="#E24E1B"/>
    <rect x="152" y="36" width="108" height="88" rx="8" fill="#FFFFFF" stroke="#E6D9C8"/>
    <text x="206" y="76" text-anchor="middle" font-size="16" font-weight="600" fill="#17141C">verify</text>
    <text x="206" y="96" text-anchor="middle" font-size="13" fill="#6B645C">fix loop</text>
    <path d="M260 80 h20" stroke="#E24E1B" stroke-width="1.5"/>
    <path d="M274 74 l8 6 -8 6" fill="#E24E1B"/>
    <rect x="288" y="36" width="108" height="88" rx="8" fill="#FFFFFF" stroke="#E6D9C8"/>
    <text x="342" y="76" text-anchor="middle" font-size="16" font-weight="600" fill="#17141C">review</text>
    <text x="342" y="96" text-anchor="middle" font-size="13" fill="#6B645C">spec score</text>
    <path d="M396 80 h20" stroke="#E24E1B" stroke-width="1.5"/>
    <path d="M410 74 l8 6 -8 6" fill="#E24E1B"/>
    <rect x="416" y="36" width="88" height="88" rx="8" fill="#FFFFFF" stroke="#E6D9C8"/>
    <text x="460" y="76" text-anchor="middle" font-size="16" font-weight="600" fill="#17141C">pipeline</text>
    <text x="460" y="96" text-anchor="middle" font-size="13" fill="#6B645C">YAML</text>
  </g>
</svg>
