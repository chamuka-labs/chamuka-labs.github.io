<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="520" height="160" fill="none" role="img" aria-labelledby="wp-title wp-desc">
  <title id="wp-title">Waypoint flow</title>
  <desc id="wp-desc">Profile and preferences in, live research with source evidence, then next steps. Direct, adjacent, and stretch roles stay labelled as such.</desc>
  <rect width="520" height="160" rx="12" fill="#FFF8F1"/>
  <g font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
    <rect x="20" y="40" width="120" height="80" rx="8" fill="#FFFFFF" stroke="#2F6B4F"/>
    <text x="80" y="76" text-anchor="middle" font-size="14" font-weight="600" fill="#17141C">profile</text>
    <text x="80" y="96" text-anchor="middle" font-size="11" fill="#6B645C">local CV</text>
    <path d="M140 80 h28" stroke="#2F6B4F" stroke-width="1.5"/>
    <path d="M162 74 l8 6 -8 6" fill="#2F6B4F"/>
    <rect x="176" y="40" width="140" height="80" rx="8" fill="#FFFFFF" stroke="#2F6B4F"/>
    <text x="246" y="76" text-anchor="middle" font-size="14" font-weight="600" fill="#17141C">research</text>
    <text x="246" y="96" text-anchor="middle" font-size="11" fill="#6B645C">sourced roles</text>
    <path d="M316 80 h28" stroke="#2F6B4F" stroke-width="1.5"/>
    <path d="M338 74 l8 6 -8 6" fill="#2F6B4F"/>
    <rect x="352" y="28" width="148" height="104" rx="8" fill="#FFFFFF" stroke="#E6D9C8"/>
    <text x="426" y="56" text-anchor="middle" font-size="12" fill="#2F6B4F">direct</text>
    <text x="426" y="78" text-anchor="middle" font-size="12" fill="#2F6B4F">adjacent</text>
    <text x="426" y="100" text-anchor="middle" font-size="12" fill="#2F6B4F">stretch</text>
    <text x="426" y="118" text-anchor="middle" font-size="11" fill="#6B645C">evidence kept</text>
  </g>
</svg>
